user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access_log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression for fast page loading
    gzip on;
    gzip_disable "msie6";
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # HTTP Server: Redirect all traffic to HTTPS, and handle Certbot SSL challenges
    server {
        listen 80;
        server_name hnxquantum.in www.hnxquantum.in;

        # Map Certbot ACME HTTP-01 challenge paths
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Force redirect all other HTTP requests to secure HTTPS port
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server: High-Security SSL Reverse Proxy Configuration
    server {
        listen 443 ssl;
        server_name hnxquantum.in www.hnxquantum.in;

        # Path to Let's Encrypt SSL Certificates (mounted via volumes in docker-compose)
        ssl_certificate /etc/letsencrypt/live/hnxquantum.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hnxquantum.in/privkey.pem;

        # Optimized SSL Protocols and Ciphers (Recommended for A+ security rating)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        
        # SSL Cache Settings to optimize connection speeds
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Serve static frontend web files
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Forward API endpoints to FastAPI container
        location /api/ {
            proxy_pass http://web:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90;
        }

        # Forward high-frequency WebSockets
        location /ws/ {
            proxy_pass http://web:8000/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600; # Keep socket open for 1 hour of streaming
        }
    }
}
